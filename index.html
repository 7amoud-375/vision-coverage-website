<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Media coverage for weddings, corporate shoots and events - photography and videography, booked online."
    />
    <title>Vision Zekra - Media Cover</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Social preview. These are what WhatsApp, Instagram DMs and Facebook read
      when the link is shared - which is exactly how this client's work gets
      passed around - so a missing card is a real loss, not cosmetic.

      og:image MUST be a raster file (JPG/PNG). WhatsApp and Facebook do not
      render SVG previews. Drop the owner's best single photograph in
      /public/og-image.jpg at 1200x630 and this starts working; until then the
      link still previews with the title and description below.
      Set og:url to the real domain after the first deploy.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vision Zekra" />
    <meta property="og:title" content="Vision Zekra - Media Cover" />
    <meta
      property="og:description"
      content="Weddings, corporate shoots and events - photography and videography, booked online."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vision Zekra - Media Cover" />
    <meta
      name="twitter:description"
      content="Weddings, corporate shoots and events - photography and videography, booked online."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Instagram embed script - loaded once for the whole app.
      Portfolio embeds are injected dynamically by React, so components call
      window.instgrm.Embeds.process() after mounting (see src/lib/instagram.js).
    -->
    <script async src="https://www.instagram.com/embed.js"></script>
  </head>
  <body class="bg-base text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
