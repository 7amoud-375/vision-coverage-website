<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!--
    Stand-in hero: warm out-of-focus highlights over a dark room, the way a fast
    lens renders a reception at night. It exists so the hero never looks
    unfinished before the client's own still is dropped in.

    Built from radial gradients rather than feGaussianBlur/feTurbulence filters.
    A soft-edged gradient *is* a blurred disc, and it costs a fraction of the
    rasterising work - the filtered version measurably stalled first paint on
    this full-bleed, mobile-first hero. The only filter left is a 90px grain
    tile, which the renderer draws once and repeats.

    To replace: put the real image in /public and point heroMedia.image (or
    .video) at it in src/lib/config.js. Nothing else needs to change.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1b1710" />
      <stop offset="45%" stop-color="#12110f" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </linearGradient>

    <radialGradient id="glow" cx="0.22" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#d8a441" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8a5f23" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cool" cx="0.82" cy="0.24" r="0.6">
      <stop offset="0%" stop-color="#4a6f96" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72" />
    </radialGradient>

    <!-- Far bokeh: very soft, no defined rim. -->
    <radialGradient id="far" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.085" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Nearer bokeh: brightest just inside the edge, like a real defocused
         point source, then falling off to nothing. -->
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0c877" stop-opacity="0.16" />
      <stop offset="62%" stop-color="#e9b75a" stop-opacity="0.22" />
      <stop offset="86%" stop-color="#f3d08a" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#e9b75a" stop-opacity="0" />
    </radialGradient>

    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" filter="url(#noise)" opacity="0.5" />
    </pattern>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#cool)" />

  <!-- Far, heavily defocused highlights -->
  <g fill="url(#far)">
    <ellipse cx="1245" cy="168" rx="150" ry="150" />
    <ellipse cx="1440" cy="330" rx="118" ry="118" />
    <ellipse cx="1080" cy="392" rx="94" ry="94" />
    <ellipse cx="322" cy="150" rx="106" ry="106" />
    <ellipse cx="150" cy="404" rx="136" ry="136" />
    <ellipse cx="760" cy="120" rx="84" ry="84" />
  </g>

  <!-- Nearer highlights, tighter and warmer -->
  <g fill="url(#warm)">
    <ellipse cx="1338" cy="236" rx="74" ry="74" />
    <ellipse cx="1163" cy="286" rx="52" ry="52" />
    <ellipse cx="1492" cy="188" rx="45" ry="45" />
    <ellipse cx="238" cy="268" rx="58" ry="58" />
    <ellipse cx="560" cy="214" rx="38" ry="38" />
    <ellipse cx="905" cy="176" rx="32" ry="32" />
  </g>

  <!-- A suggestion of a floor line, well below the headline text -->
  <path d="M0 726 Q 420 690 860 714 T 1600 700 L1600 900 L0 900 Z" fill="#000000" opacity="0.42" />

  <rect width="1600" height="900" fill="url(#vignette)" />
  <rect width="1600" height="900" fill="url(#grain)" />
</svg>
