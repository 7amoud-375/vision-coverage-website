<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Vision Zekra chevron. Kept deliberately heavier and simpler than the full
    mark: at 16px in a browser tab, the nested triangle's fine lines would just
    turn to mud, so the inner form is solid rather than outlined.
  -->
  <rect width="64" height="64" fill="#000000" />
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="miter">
    <path d="M8 16 L32 57 L56 16" />
    <path d="M8 16 L22 16" />
    <path d="M42 16 L56 16" />
  </g>
  <path d="M24 19 L40 19 L32 40 Z" fill="#ffffff" />
</svg>
